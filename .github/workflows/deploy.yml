name: Deploy Scents by Aamir

on:
  push:
    branches:
      - main

concurrency:
  group: scents-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to StackCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STACKCP_SSH_KEY }}
          SSH_HOST: ${{ secrets.STACKCP_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "SSH key loaded successfully."

      - name: Test StackCP SSH connection
        env:
          SSH_HOST: ${{ secrets.STACKCP_HOST }}
          SSH_USER: ${{ secrets.STACKCP_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "$SSH_USER@$SSH_HOST" \
            "echo 'StackCP SSH connection successful'"

      - name: Deploy Laravel source
        env:
          SSH_HOST: ${{ secrets.STACKCP_HOST }}
          SSH_USER: ${{ secrets.STACKCP_USER }}
          APP_PATH: ${{ secrets.STACKCP_APP_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$SSH_USER@$SSH_HOST" "
              set -e
              cd '$APP_PATH'
              git fetch origin main
              git reset --hard origin/main
              /usr/php84/usr/bin/php /usr/local/bin/composer install \
                --no-dev \
                --no-interaction \
                --prefer-dist \
                --optimize-autoloader
              /usr/php84/usr/bin/php artisan optimize:clear
              /usr/php84/usr/bin/php artisan migrate --force
            "

      - name: Upload compiled Vite assets
        env:
          SSH_HOST: ${{ secrets.STACKCP_HOST }}
          SSH_USER: ${{ secrets.STACKCP_USER }}
          APP_PATH: ${{ secrets.STACKCP_APP_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$APP_PATH/public/build'"

          rsync \
            -az \
            --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            public/build/ \
            "$SSH_USER@$SSH_HOST:$APP_PATH/public/build/"

      - name: Warm Laravel caches
        env:
          SSH_HOST: ${{ secrets.STACKCP_HOST }}
          SSH_USER: ${{ secrets.STACKCP_USER }}
          APP_PATH: ${{ secrets.STACKCP_APP_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$SSH_USER@$SSH_HOST" "
              set -e
              cd '$APP_PATH'
              /usr/php84/usr/bin/php artisan route:cache
              /usr/php84/usr/bin/php artisan view:cache
              /usr/php84/usr/bin/php artisan about
            "
